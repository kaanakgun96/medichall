      - name: Commit backend workspace
        shell: bash
        run: |
          git checkout refs/remotes/feature/react-migration -- \
            docs/matchmaking-workspace-architecture-2026-07-28.md \
            supabase/migrations/202607280002_matchmaking_workspace_schema.sql \
            supabase/migrations/202607280003_matchmaking_workspace_workflows.sql \
            supabase/migrations/202607280004_matchmaking_video_and_automation.sql \
            supabase/migrations/202607280005_matchmaking_function_privilege_hardening.sql \
            supabase/migrations/202607280006_matchmaking_idempotency_digest.sql \
            supabase/tests/matchmaking_workspace.sql
          git commit -m "Build matchmaking workspace backend"
      - name: Commit secure video provider
        shell: bash
        run: |
          git checkout refs/remotes/feature/react-migration -- \
            .env.example \
            supabase/config.toml \
            supabase/functions/_shared/meeting-video-provider.test.ts \
            supabase/functions/_shared/meeting-video-provider.ts \
            supabase/functions/meeting-video/index.ts
          git commit -m "Add secure meeting video provider"
      - name: Commit production portal workspace
        shell: bash
        run: |
          git checkout refs/remotes/feature/react-migration -- \
            apps/portal-react/src/features/matchmaking/portal-matchmaking-workspace.test.ts \
            portal.html
          git commit -m "Build production matchmaking workspace"
      - name: Commit deployment handoff and publish
        shell: bash
        run: |
          git checkout refs/remotes/feature/react-migration -- \
            deliverables/medichall-matchmaking-workspace-2026-07-28/README.md \
            deliverables/medichall-matchmaking-workspace-2026-07-28/SHA256SUMS.txt \
            deliverables/medichall-matchmaking-workspace-2026-07-28/portal.html \
            docs/matchmaking-workspace-deployment-report-2026-07-28.md
          git rm .github/workflows/publish-matchmaking-workspace.yml
          git commit -m "Package matchmaking deployment handoff [workspace-publisher]"
          test "$(git rev-parse HEAD^{tree})" = "0f31601c108dcc57ea9af99f5d083f337557417a"
          test -z "$(git status --porcelain)"
          git push origin HEAD:react-migration
          git branch -f final-workspace HEAD
          git bundle create /tmp/medichall-final.bundle final-workspace ^d69b384056fd24422f15f414274203012857a149
          git bundle verify /tmp/medichall-final.bundle
      - name: Upload final Git bundle
        uses: actions/upload-artifact@v4
        with:
          name: medichall-final-git-bundle
          path: /tmp/medichall-final.bundle
          retention-days: 1
          if-no-files-found: error
