<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matchmaking Workspace — MedicHall</title>
<meta name="robots" content="noindex,nofollow">
<style>
  html,body{height:100%;margin:0}
  body{display:grid;place-items:center;background:#EFF6F9;color:#003E52;font:500 15px/1.5 system-ui,sans-serif}
  .boot{padding:24px;text-align:center}
  .boot b{display:block;margin-bottom:5px}
  .boot p{margin:0;color:#40748E}
</style>
</head>
<body>
<div class="boot" role="status">
  <b>Opening MedicHall Matchmaking…</b>
  <p>The authenticated workspace is loading.</p>
</div>
<script>
(() => {
  if(!location.hash){
    history.replaceState(null,"",location.pathname+location.search+"#matchmaking");
  }
  fetch(new URL("portal.html",location.href),{
    cache:"no-store",
    credentials:"same-origin"
  }).then(response => {
    if(!response.ok) throw new Error("The Matchmaking Workspace could not be loaded.");
    return response.text();
  }).then(html => {
    document.open();
    document.write(html);
    document.close();
  }).catch(error => {
    document.querySelector(".boot").innerHTML="<b>Workspace unavailable</b><p>"+String(error.message||error)+"</p>";
  });
})();
</script>
</body>
</html>
