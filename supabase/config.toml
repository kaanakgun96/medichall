[functions.medichall-ai]
verify_jwt = true

[functions.ted-sync]
verify_jwt = false

[functions.ted-notice-resolver]
verify_jwt = true

[functions.tender-attachment-discovery]
verify_jwt = true

[functions.tender-archive-worker]
verify_jwt = true

# JWT verification happens in-function: user requests are validated via
# auth.getUser, and the pg_cron sweeper / self-continuation hand-offs
# authenticate with the x-cron-secret header (which the platform-level
# JWT check would otherwise reject).
[functions.tender-document-engine]
verify_jwt = false

# JWT verification happens in-function with auth.getUser. The coordinator
# reuses the caller's scoped token when queueing existing discovery, archive,
# and document-intelligence workers; service-role access is never returned.
[functions.tender-import]
verify_jwt = false

# JWT verification happens in-function with auth.getUser so the endpoint uses
# the same legacy-session-compatible authorization contract as the document
# engine. No AI or internal cron authorization path exists here.
[functions.tender-lot-matching]
verify_jwt = false

# JWT verification happens in-function with auth.getUser. Product mutations
# then use the caller's token and the existing products RLS policies; the
# browser never receives or exercises service-role access.
[functions.product-profile]
verify_jwt = false

# JWT verification happens in-function with auth.getUser. The endpoint then
# authorizes every action through participant-scoped RPCs; provider credentials
# and the Supabase service-role key remain confined to the Edge runtime.
[functions.meeting-video]
verify_jwt = false
